services:
  postgres:
    image: postgres:17
    container_name: tenant-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tenantai
      POSTGRES_PASSWORD: tenantai_local_dev
      POSTGRES_DB: tenantai
    ports:
      - "5433:5432"
    volumes:
      - tenantai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantai -d tenantai"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: tenantai-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  tenantai-postgres-data:
