services:
  postgres:
    image: postgres:17
    container_name: tenant-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tenantai
      POSTGRES_PASSWORD: tenantai_local_dev
      POSTGRES_DB: tenantai
    ports:
      - "5433:5432"
    volumes:
      - tenantai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantai -d tenantai"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: tenantai-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: tenantai-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: tenantai-ai-service
    restart: unless-stopped
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:1b
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - jaeger

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tenantai-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://tenantai:tenantai_local_dev@postgres:5432/tenantai
      AI_SERVICE_URL: http://ai-service:8000
      KEYCLOAK_ISSUER: http://localhost:8081/realms/tenant-ai
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/tenant-ai/protocol/openid-connect/certs
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4317
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: tenantai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - tenantai-prometheus-data:/prometheus
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - ai-service
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: tenantai-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - tenantai-alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0
    container_name: tenantai-grafana
    ports:
      - "3002:3000"
    volumes:
      - tenantai-grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  tenantai-postgres-data:
  tenantai-prometheus-data:
  tenantai-grafana-data:
  tenantai-alertmanager-data:
